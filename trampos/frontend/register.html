<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trampos – Cadastro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🔧 <strong>Trampos</strong></div>
    <h1 class="auth-title">Criar conta</h1>

    <form id="form-register" novalidate>

      <div class="form-group">
        <label for="nome">Nome completo <span class="required">*</span></label>
        <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name" />
        <span class="field-error"></span>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
        <span class="field-error"></span>
      </div>

      <div class="form-group">
        <label>Tipo de conta <span class="required">*</span></label>
        <div class="tipo-selector">
          <label class="tipo-option">
            <input type="radio" name="tipo" value="freelancer" checked />
            <div class="tipo-card">
              <span class="tipo-icon">👷</span>
              <strong>Freelancer</strong>
              <small>Busco trabalhos</small>
            </div>
          </label>
          <label class="tipo-option">
            <input type="radio" name="tipo" value="empresa" />
            <div class="tipo-card">
              <span class="tipo-icon">🏢</span>
              <strong>Empresa</strong>
              <small>Ofereço vagas</small>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha <span class="required">*</span></label>
        <div class="input-group">
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <button type="button" class="input-toggle" onclick="toggleSenha('senha')">👁</button>
        </div>
        <span class="field-error"></span>
      </div>

      <div class="form-group">
        <label for="confirmar">Confirmar senha <span class="required">*</span></label>
        <div class="input-group">
          <input type="password" id="confirmar" placeholder="Repita a senha" autocomplete="new-password" />
          <button type="button" class="input-toggle" onclick="toggleSenha('confirmar')">👁</button>
        </div>
        <span class="field-error"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-register">Criar conta</button>
    </form>

    <p class="auth-footer">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  if (getUser()) window.location.href = "index.html";

  document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearValidation(e.target);

    const nomeInput     = document.getElementById("nome");
    const emailInput    = document.getElementById("email");
    const senhaInput    = document.getElementById("senha");
    const confirmInput  = document.getElementById("confirmar");
    const tipo          = document.querySelector('input[name="tipo"]:checked').value;

    let ok = true;
    ok = validate(nomeInput,  regex.nome,  "Nome deve ter 3–100 letras (sem números).") && ok;
    ok = validate(emailInput, regex.email, "Email inválido.")                           && ok;
    ok = validate(senhaInput, regex.senha, "Senha deve ter no mínimo 6 caracteres.")   && ok;

    const match = senhaInput.value === confirmInput.value;
    setFieldState(confirmInput, match, "As senhas não coincidem.");
    ok = match && ok;

    if (!ok) return;

    const btn = document.getElementById("btn-register");
    btn.disabled = true; btn.textContent = "Criando...";

    try {
      const res = await fetch(`${API}/usuarios`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome: nomeInput.value.trim(),
          email: emailInput.value.trim(),
          senha: senhaInput.value,
          tipo,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.detail || "Erro ao cadastrar.", "error");
      } else {
        setUser(data);
        showToast("Conta criada! Bem-vindo(a) 🎉", "success");
        setTimeout(() => window.location.href = "index.html", 700);
      }
    } catch {
      showToast("Erro de conexão com o servidor.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Criar conta";
    }
  });
</script>
</body>
</html>
