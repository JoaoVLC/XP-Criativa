<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trampos – Vagas Disponíveis</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav id="main-nav"></nav>

  <div id="user-info" class="user-info"></div>
  
  <div class="container">
    <div class="page-header">
      <div>
        <h1>Vagas Disponíveis</h1>
        <p class="page-subtitle">Encontre trabalhos informais perto de você</p>
      </div>
      <div class="filter-bar">
        <input type="text" id="search" class="search-input" placeholder="🔍 Buscar por título, local..." />
        <select id="filter-cat" class="select-input">
          <option value="">Todas as categorias</option>
        </select>
      </div>
    </div>

  <div id="job-list" class="job-list">
    <div class="skeleton-list">
      <div class="skeleton card-skeleton"></div>
      <div class="skeleton card-skeleton"></div>
      <div class="skeleton card-skeleton"></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  renderUserInfo();
  renderNav("vagas");

  let todasVagas = [];

  async function carregarCategorias() {
    try {
      const cats = await (await fetch(`${API}/categorias`)).json();
      const sel  = document.getElementById("filter-cat");
      cats.forEach(c => {
        const o = document.createElement("option");
        o.value = c.id_categoria; o.textContent = c.nome;
        sel.appendChild(o);
      });
    } catch {}
  }

  async function carregarVagas() {
    const list = document.getElementById("job-list");
    try {
      const res = await fetch(`${API}/vagas`);
      todasVagas = await res.json();
      renderVagas(todasVagas);
    } catch {
      list.innerHTML = `<div class="empty-state"><span>⚠️</span><p>Erro ao carregar vagas. Verifique se o servidor está rodando.</p></div>`;
    }
  }

  function renderVagas(vagas) {
    const list = document.getElementById("job-list");
    if (!vagas.length) {
      list.innerHTML = `<div class="empty-state"><span>🔍</span><p>Nenhuma vaga encontrada.</p></div>`;
      return;
    }
    list.innerHTML = vagas.map(v => `
      <div class="job-card">
        <div class="job-card-body">
          <div class="job-card-header">
            ${v.categoria ? `<span class="badge badge-secondary">${v.categoria.nome}</span>` : ""}
          </div>
          <h2 class="job-card-title"><a href="job.html?id=${v.id_vaga}">${v.titulo}</a></h2>
          <p class="job-card-desc">${v.descricao.substring(0,110)}${v.descricao.length > 110 ? "…" : ""}</p>
          <div class="job-card-meta">
            <span>📍 ${v.local}</span>
            <span>📅 ${formatDate(v.data)}</span>
            <span>💰 ${formatMoney(v.pagamento)}</span>
            ${v.empresa ? `<span>🏢 ${v.empresa.nome}</span>` : ""}
          </div>
        </div>
        <div class="job-card-action">
          <a href="job.html?id=${v.id_vaga}" class="btn btn-primary btn-sm">Ver detalhes</a>
        </div>
      </div>`).join("");
  }

  function filtrar() {
    const termo = document.getElementById("search").value.toLowerCase();
    const catId = document.getElementById("filter-cat").value;
    renderVagas(todasVagas.filter(v =>
      (!termo || v.titulo.toLowerCase().includes(termo) || v.local.toLowerCase().includes(termo) || v.descricao.toLowerCase().includes(termo)) &&
      (!catId || String(v.id_categoria) === catId)
    ));
  }

  document.getElementById("search").addEventListener("input", filtrar);
  document.getElementById("filter-cat").addEventListener("change", filtrar);

  carregarCategorias();
  carregarVagas();
</script>
</body>
</html>
