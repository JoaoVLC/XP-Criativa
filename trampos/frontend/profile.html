<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trampos – Meu Perfil</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    renderUserInfo();
  </script>
</head>
<body>

<nav id="main-nav"></nav>

<div id="user-info" class="user-info"></div>

<div class="container">
  <div class="profile-grid">

    <!-- ── Edit panel ── -->
    <div>
      <div class="card mb-4">
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar"></div>
          <div>
            <h2 id="profile-nome" style="font-size:1.15rem;font-weight:700;"></h2>
            <span class="badge" id="profile-tipo"></span>
          </div>
        </div>
        <hr class="divider" />

        <p class="section-title">Editar perfil</p>
        <form id="form-perfil" novalidate>
          <div class="form-group">
            <label for="edit-nome">Nome</label>
            <input type="text" id="edit-nome" autocomplete="name" />
            <span class="field-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" autocomplete="email" />
            <span class="field-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-senha">Nova senha <small>(deixe em branco para manter)</small></label>
            <div class="input-group">
              <input type="password" id="edit-senha" placeholder="Nova senha" />
              <button type="button" class="input-toggle" onclick="toggleSenha('edit-senha')">👁</button>
            </div>
            <span class="field-error"></span>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" onclick="confirmarExclusao()">Excluir conta</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── Activity panel ── -->
    <div>
      <div class="card">
        <p class="section-title" id="activity-title">Atividade</p>
        <div id="activity-list">
          <div class="skeleton-list">
            <div class="skeleton" style="height:56px;"></div>
            <div class="skeleton" style="height:56px;"></div>
            <div class="skeleton" style="height:56px;"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
  const user = requireLogin();
  if (!user) throw new Error();
  renderNav("perfil");

  // Populate header
  document.getElementById("profile-avatar").textContent = user.nome[0].toUpperCase();
  document.getElementById("profile-nome").textContent   = user.nome;
  const tipoEl = document.getElementById("profile-tipo");
  tipoEl.textContent = user.tipo === "empresa" ? "🏢 Empresa" : "👷 Freelancer";
  tipoEl.className   = `badge badge-${user.tipo === "empresa" ? "primary" : "success"}`;

  // Pre-fill form
  document.getElementById("edit-nome").value  = user.nome;
  document.getElementById("edit-email").value = user.email;

  // Load activity
  if (user.tipo === "empresa") {
    document.getElementById("activity-title").textContent = "Minhas vagas";
    carregarVagas();
  } else {
    document.getElementById("activity-title").textContent = "Minhas candidaturas";
    carregarCandidaturas();
  }

  // ── Edit form ───────────────────────────────────────────
  document.getElementById("form-perfil").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearValidation(e.target);

    const nomeInput  = document.getElementById("edit-nome");
    const emailInput = document.getElementById("edit-email");
    const senhaInput = document.getElementById("edit-senha");

    let ok = true;
    ok = validate(nomeInput,  regex.nome,  "Nome deve ter 3–100 letras.") && ok;
    ok = validate(emailInput, regex.email, "Email inválido.")             && ok;
    if (senhaInput.value && !regex.senha.test(senhaInput.value)) {
      setFieldState(senhaInput, false, "Senha deve ter no mínimo 6 caracteres.");
      ok = false;
    }
    if (!ok) return;

    const payload = { nome: nomeInput.value.trim(), email: emailInput.value.trim() };
    if (senhaInput.value) payload.senha = senhaInput.value;

    try {
      const res = await fetch(`${API}/usuarios/${user.id_usuario}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.detail || "Erro ao atualizar.", "error");
      } else {
        setUser(data);
        showToast("Perfil atualizado! ✅", "success");
        document.getElementById("profile-nome").textContent   = data.nome;
        document.getElementById("profile-avatar").textContent = data.nome[0].toUpperCase();
        senhaInput.value = "";
        clearValidation(e.target);
      }
    } catch {
      showToast("Erro de conexão.", "error");
    }
  });

  // ── Delete account ──────────────────────────────────────
  function confirmarExclusao() {
    showModal("Excluir conta",
      "Esta ação é irreversível e apagará todos os seus dados.",
      async () => {
        try {
          const res = await fetch(`${API}/vagas/${id}?id_usuario=${user.id_usuario}`, {
            method: "DELETE"
          });
          if (res.ok) {
            localStorage.removeItem("trampos_user");
            showToast("Conta excluída.", "success");
            setTimeout(() => window.location.href = "login.html", 1000);
          } else {
            showToast("Erro ao excluir conta.", "error");
          }
        } catch { showToast("Erro de conexão.", "error"); }
      });
  }

  // ── Load employer jobs ──────────────────────────────────
  async function carregarVagas() {
    const list = document.getElementById("activity-list");
    try {
      const res   = await fetch(`${API}/vagas/empresa/${user.id_usuario}`);
      const vagas = await res.json();
      if (!vagas.length) {
        list.innerHTML = `<p class="empty-small">Nenhuma vaga publicada ainda.<br>
          <a href="create-job.html" class="btn btn-primary btn-sm" style="margin-top:.75rem;">Publicar vaga</a></p>`;
        return;
      }
      list.innerHTML = vagas.map(v => `
        <div class="activity-item">
          <div class="activity-info">
            <a href="job.html?id=${v.id_vaga}" class="activity-title">${v.titulo}</a>
            <div class="activity-meta">📍 ${v.local} &nbsp;·&nbsp; 📅 ${formatDate(v.data)} &nbsp;·&nbsp; 💰 ${formatMoney(v.pagamento)}</div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="excluirVaga(${v.id_vaga}, this)">Excluir</button>
        </div>`).join("");
    } catch {
      list.innerHTML = `<p class="empty-small">Erro ao carregar vagas.</p>`;
    }
  }

  async function excluirVaga(id, btn) {
    showModal("Excluir vaga", "Deseja excluir esta vaga e suas candidaturas?", async () => {
      try {
        const res = await fetch(`${API}/vagas/${id}`, { method: "DELETE" });
        if (res.ok) { showToast("Vaga excluída.", "success"); carregarVagas(); }
        else showToast("Erro ao excluir.", "error");
      } catch { showToast("Erro de conexão.", "error"); }
    });
  }

  // ── Load freelancer applications ─────────────────────────
  async function carregarCandidaturas() {
    const list = document.getElementById("activity-list");
    try {
      const res   = await fetch(`${API}/candidaturas/usuario/${user.id_usuario}`);
      const cands = await res.json();
      if (!cands.length) {
        list.innerHTML = `<p class="empty-small">Nenhuma candidatura ainda.<br>
          <a href="index.html" class="btn btn-primary btn-sm" style="margin-top:.75rem;">Ver vagas</a></p>`;
        return;
      }
      const statusLabel = { pendente: "⏳ Pendente", aceito: "✅ Aceito", recusado: "❌ Recusado" };
      const statusClass = { pendente: "warning",    aceito: "success",   recusado: "danger"   };
      list.innerHTML = cands.map(c => `
        <div class="activity-item">
          <div class="activity-info">
            <a href="job.html?id=${c.id_vaga}" class="activity-title">
              ${c.vaga ? c.vaga.titulo : `Vaga #${c.id_vaga}`}
            </a>
            <div class="activity-meta">
              ${c.vaga ? `📍 ${c.vaga.local} &nbsp;·&nbsp; 📅 ${formatDate(c.vaga.data)}` : ""}
            </div>
          </div>
          <span class="badge badge-${statusClass[c.status] || 'secondary'}">
            ${statusLabel[c.status] || c.status}
          </span>
        </div>`).join("");
    } catch {
      list.innerHTML = `<p class="empty-small">Erro ao carregar candidaturas.</p>`;
    }
  }
</script>
</body>
</html>
