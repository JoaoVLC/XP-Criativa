{% extends "base.html" %}

{% block content %}
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-logo"><img src="{{ static_asset_url(request, 'img/logo.png') }}" alt="Trampos" class="auth-logo-image" /></div>
      <h1 class="auth-title">Entrar na conta</h1>
      <form method="post" action="{{ url_for('login') }}" novalidate>
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" value="{{ form_data.email }}" placeholder="seu@email.com" class="{{ 'input-error' if errors.get('email') else '' }}" autocomplete="email" required />
          <span class="helper-text">Use o email cadastrado na plataforma.</span>
          <span class="field-error">{{ errors.get('email', '') }}</span>
        </div>
        <div class="form-group">
          <label for="senha">Senha <span class="required">*</span></label>
          <div class="input-group">
            <input type="password" id="senha" name="senha" placeholder="Sua senha" class="{{ 'input-error' if errors.get('senha') else '' }}" autocomplete="current-password" required />
            <button type="button" class="input-toggle" onclick="toggleSenha('senha')" title="Mostrar ou ocultar">Ver</button>
          </div>
          <span class="field-error">{{ errors.get('senha', '') }}</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <p class="auth-footer">Não tem conta? <a href="{{ url_for('register_page') }}">Cadastre-se</a></p>
    </section>
  </main>
{% endblock %}
