{% extends "base.html" %}

{% block content %}
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="{{ url_for('static', path='img/logo.png') }}" alt="Trampos" class="auth-logo-image" />
      </div>
      <h1 class="auth-title">Entrar na conta</h1>

      <form method="post" action="{{ url_for('login') }}" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            value="{{ form_data.email }}"
            class="{{ 'input-error' if errors.get('email') else '' }}"
            autocomplete="email"
          />
          <span class="field-error">{{ errors.get('email', '') }}</span>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-group">
            <input
              type="password"
              id="senha"
              name="senha"
              class="{{ 'input-error' if errors.get('senha') else '' }}"
              autocomplete="current-password"
            />
            <button type="button" class="input-toggle" onclick="toggleSenha('senha')" title="Mostrar ou ocultar">
              👁
            </button>
          </div>
          <span class="field-error">{{ errors.get('senha', '') }}</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="auth-footer">
        Nao tem conta?
        <a href="{{ url_for('register_page') }}">Cadastre-se</a>
      </p>
    </div>
  </div>
{% endblock %}
