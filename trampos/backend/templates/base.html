<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" href="{{ static_asset_url(request, 'img/logo.png') }}" />
  <title>Trampos - {{ page_title }}</title>
  <link rel="stylesheet" href="{{ static_asset_url(request, 'css/styles.css') }}" />
</head>
<body class="{{ body_class | default('') }}">
  {% if show_nav %}
    {% include "partials/nav.html" %}
  {% endif %}

  {% include "partials/flash.html" %}

  {% block content %}{% endblock %}

  <script>
    function toggleNav() {
      const menu = document.getElementById("nav-menu");
      if (menu) {
        menu.classList.toggle("open");
      }
    }

    function toggleSenha(id) {
      const field = document.getElementById(id);
      if (field) {
        field.type = field.type === "password" ? "text" : "password";
      }
    }

    async function submitEnhancedForm(form) {
      const targetSelector = form.dataset.updateTarget;
      const currentRegion = targetSelector ? document.querySelector(targetSelector) : null;

      if (!targetSelector || !currentRegion) {
        form.submit();
        return;
      }

      if (form.dataset.loading === "true") {
        return;
      }

      const nextUrl = new URL(form.action || window.location.href, window.location.origin);
      const params = new URLSearchParams(new FormData(form));
      nextUrl.search = params.toString();

      form.dataset.loading = "true";
      form.classList.add("is-loading");
      currentRegion.setAttribute("aria-busy", "true");

      try {
        const response = await fetch(nextUrl, {
          headers: { "X-Requested-With": "fetch" },
          credentials: "same-origin",
        });

        if (!response.ok) {
          throw new Error("Nao foi possivel atualizar as vagas.");
        }

        const html = await response.text();
        const nextDocument = new DOMParser().parseFromString(html, "text/html");
        const nextRegion = nextDocument.querySelector(targetSelector);

        if (!nextRegion) {
          throw new Error("Regiao de vagas nao encontrada.");
        }

        currentRegion.replaceWith(nextRegion);
        window.history.replaceState({}, "", nextUrl);
      } catch (error) {
        window.location.assign(nextUrl);
      } finally {
        form.dataset.loading = "false";
        form.classList.remove("is-loading");
        currentRegion.removeAttribute("aria-busy");
      }
    }

    document.addEventListener("change", (event) => {
      const field = event.target.closest("[data-auto-submit='true']");
      if (!field || !field.form) {
        return;
      }

      field.form.requestSubmit();
    });

    document.addEventListener("submit", (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || form.dataset.enhancedFilter !== "true") {
        return;
      }

      event.preventDefault();
      submitEnhancedForm(form);
    });
  </script>
</body>
</html>
